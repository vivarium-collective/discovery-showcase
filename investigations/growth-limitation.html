<script>
const INV = JSON.parse(document.getElementById('data').textContent);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Light markdown for authored prose fields (conclusions carry ## headers, **bold**, `code`).
function mdLite(t){
  if(t==null) return '';
  let s=esc(t);
  s=s.replace(/\s*#{2,}\s*([^\n]+?)\s*-\s+/g,'<br><b>$1</b> — ');   // "## Claims - " → bold header
  s=s.replace(/\s*#{1,}\s*([^\n]+)/g,'<br><b>$1</b>');              // any remaining # header
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/`([^`]+)`/g,'<span class="mono">$1</span>');
  return s.replace(/^\s*<br>\s*/,'');
}

// The Model-section "loom view": the composite's resolved bigraph — the nested
// state tree (name : type) beside the process list (name · address · ports).
// Static bigraph of the composite — a self-contained SVG that reads like a
// process-bigraph: the PLACE GRAPH (compartments as containers holding their
// state leaves) on the right, the PROCESS nodes (with typed in/out ports) on the
// left, and the LINK GRAPH (each process wired to every compartment it reads or
// writes) drawn as connectors between them. Compartments, their state leaves and
// the wiring are all derived from the topology's edges ({p: process, c:
// compartment, s: state}); the declared store tree fills in any unwired
// compartments + leaf types. No server, no interactivity — embeds + prints.
function loomTopoSVG(topo){
  if(!topo) return '';
  const procs=topo.processes||[], edges=topo.edges||[], storeTree=topo.stores||[];

  // --- Derive the bigraph: compartment -> state leaves, and link weights. ---
  const compStates=new Map();          // compartment -> Set(state names)
  const typeOf={};                     // "comp" or "comp.state" -> type label
  edges.forEach(e=>{ if(e.c==null) return;
    if(!compStates.has(e.c)) compStates.set(e.c,new Set());
    if(e.s) compStates.get(e.c).add(e.s); });
  (function walk(ns){ (ns||[]).forEach(n=>{ if(n.name==null) return;
    if(!compStates.has(n.name)) compStates.set(n.name,new Set());
    if(n.type) typeOf[n.name]=n.type;
    (n.children||[]).forEach(ch=>{ if(ch.name){ compStates.get(n.name).add(ch.name);
      if(ch.type) typeOf[n.name+'.'+ch.name]=ch.type; } }); }); })(storeTree);
  const comps=[...compStates.keys()];
  if(!procs.length && !comps.length) return '';
  const linkStates={};                 // "proc|comp" -> Set(shared state names)
  edges.forEach(e=>{ if(e.p==null||e.c==null) return; const k=e.p+'|'+e.c;
    (linkStates[k]||(linkStates[k]=new Set())).add(e.s); });
  const outSet={};                     // proc -> Set(output port names) for read/write colouring
  procs.forEach(p=>{ outSet[p.name]=new Set(p.outputs||[]); });
  // Keep a process box's text on one line: truncate a port list to ~max chars,
  // trailing "+N" for the remainder, and clip an over-long address.
  const portStr=(arr,max)=>{ arr=(arr||[]).map(String); if(!arr.length) return '—';
    let out='',i=0; for(; i<arr.length; i++){ const nxt=out?out+', '+arr[i]:arr[i]; if(nxt.length>max && out) break; out=nxt; }
    const rem=arr.length-i; return (out.length>max?out.slice(0,max-1)+'…':out)+(rem>0?` +${rem}`:''); };
  const clip=(s,max)=>{ s=String(s||''); return s.length>max?s.slice(0,max-1)+'…':s; };

  // --- Geometry: processes (left column) ⇄ compartments (right column). ---
  const PADX=14, TOP=30, GAP=118, PW=236, CW=210, VGAP=16;
  const ph=p=>20+(p.address?13:0)+14+14+12;            // process box height
  const ch=c=>{ const n=compStates.get(c).size; return 22+(n?n*15+8:8); };  // compartment box height
  const procY={}; let py=TOP; procs.forEach(p=>{ procY[p.name]=py; py+=ph(p)+VGAP; });
  const compY={}; let cy=TOP; comps.forEach(c=>{ compY[c]=cy; cy+=ch(c)+VGAP; });
  const procX=PADX, compX=PADX+PW+GAP;
  const W=compX+CW+PADX, H=Math.max(py,cy)+6;

  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12">`;
  sv+=`<text x="${procX}" y="16" fill="var(--ink-3)" font-size="10" letter-spacing=".08em">PROCESSES</text>`;
  sv+=`<text x="${compX}" y="16" fill="var(--ink-3)" font-size="10" letter-spacing=".08em">COMPARTMENTS · STATE</text>`;

  // Link graph first, so the node boxes sit on top of the wires. A link is a
  // "write" (accent) when the process outputs any of the states it shares with
  // that compartment, else a "read" (muted); thickness grows with shared states.
  Object.keys(linkStates).forEach(k=>{ const [pn,cn]=k.split('|');
    if(procY[pn]==null||compY[cn]==null) return;
    const y1=procY[pn]+ph(procs.find(p=>p.name===pn))/2, y2=compY[cn]+ch(cn)/2;
    const x1=procX+PW, x2=compX, mx=(x1+x2)/2;
    const sts=linkStates[k], os=outSet[pn]||new Set();
    const write=[...sts].some(s=>os.has(s));
    const w=Math.min(4,sts.size), col=write?'var(--accent)':'var(--line-2)';
    sv+=`<path d="M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" fill="none" `+
        `stroke="${col}" stroke-width="${0.8+w*0.5}" opacity="${write?0.55:0.4}"/>`;
  });

  // Process nodes: name, address, typed in/out ports.
  procs.forEach(p=>{ const y=procY[p.name], h=ph(p); let ty=y+21;
    sv+=`<rect x="${procX}" y="${y}" width="${PW}" height="${h}" rx="9" fill="var(--surface)" stroke="var(--accent)"/>`;
    sv+=`<circle cx="${procX+PW}" cy="${y+h/2}" r="3.5" fill="var(--accent)"/>`;
    sv+=`<text x="${procX+12}" y="${ty}" fill="var(--ink)" font-weight="700" font-family="var(--mono)" font-size="12.5">${esc(p.name)}</text>`; ty+=15;
    if(p.address){ sv+=`<text x="${procX+12}" y="${ty}" fill="var(--ink-3)" font-size="10.5" font-family="var(--mono)">${esc(clip(p.address,34))}</text>`; ty+=14; }
    sv+=`<text x="${procX+12}" y="${ty}" fill="var(--ink-2)" font-size="10.5">in: <tspan fill="var(--ink)">${esc(portStr(p.inputs,30))}</tspan></text>`; ty+=14;
    sv+=`<text x="${procX+12}" y="${ty}" fill="var(--ink-2)" font-size="10.5">out: <tspan fill="var(--ink)">${esc(portStr(p.outputs,29))}</tspan></text>`;
  });

  // Compartment containers (place graph): header + nested state leaves.
  comps.forEach(c=>{ const y=compY[c], h=ch(c), states=[...compStates.get(c)];
    sv+=`<rect x="${compX}" y="${y}" width="${CW}" height="${h}" rx="8" fill="var(--sunken)" stroke="var(--line)"/>`;
    sv+=`<circle cx="${compX}" cy="${y+h/2}" r="3.5" fill="var(--ink-3)"/>`;
    sv+=`<text x="${compX+11}" y="${y+15}" fill="var(--ink)" font-weight="700" font-family="var(--mono)" font-size="11.5">${esc(c)}</text>`;
    if(typeOf[c]) sv+=`<text x="${compX+CW-10}" y="${y+15}" text-anchor="end" fill="var(--ink-3)" font-size="9.5" font-family="var(--mono)">${esc(typeOf[c])}</text>`;
    states.forEach((s,j)=>{ const ly=y+22+j*15;
      sv+=`<rect x="${compX+9}" y="${ly}" width="${CW-18}" height="13" rx="3" fill="var(--surface)" stroke="var(--line)"/>`;
      sv+=`<text x="${compX+15}" y="${ly+10}" fill="var(--ink-2)" font-family="var(--mono)" font-size="10">${esc(s)}</text>`;
      const tt=typeOf[c+'.'+s]; if(tt) sv+=`<text x="${compX+CW-14}" y="${ly+10}" text-anchor="end" fill="var(--accent)" font-size="9" font-family="var(--mono)">${esc(tt)}</text>`;
    });
  });

  sv+=`</svg>`;
  const nLinks=Object.keys(linkStates).length;
  const cap=`Static bigraph of <span class="mono">${esc(topo.composite||'')}</span> — `+
    `${procs.length} process${procs.length==1?'':'es'} wired to ${comps.length} compartment${comps.length==1?'':'s'}`+
    (nLinks?` over ${nLinks} link${nLinks==1?'':'s'}`:'')+`. `+
    `<span style="color:var(--accent)">●</span> writes · <span style="color:var(--ink-3)">●</span> reads.`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>${cap}</figcaption></figure>`;
}

// Shared id counter for the loom-embed helpers below (loomRealEmbed).
let _ILOOM_SEQ=0;

// Embed the REAL bigraph-loom for a study's baseline composite — the same live
// loom the workbench serves at /bigraph-loom/, so the Model section shows loom's
// own rendering instead of a re-drawn topology. Returns '' when no composite is
// known (caller then falls back to the static topology SVG). When the report is
// opened standalone (file://) the loom route is unreachable and the iframe stays
// blank — the caption's "static topology" <details> is the offline fallback.
function loomEmbed(s){
  const cid=(s.model_topology&&s.model_topology.composite) || (s.baseline&&s.baseline[0]&&s.baseline[0].composite);
  if(!cid) return '';
  const topo=s.model_topology?loomTopoSVG(s.model_topology):'';
  // No live loom to embed → nothing to add beyond the static topology, which
  // the caller renders directly. Returning '' lets modelBody fall through to it.
  if(!topo) return '';
  const snap=document.body.classList.contains('snapshot');
  const base='bigraph-loom/index.html';
  const src=snap
    ? base+'?static=1&stateUrl='+encodeURIComponent('api/composite-state/'+encodeURIComponent(cid)+'.json')+'&chrome=off'
    : base+'?id='+encodeURIComponent(cid)+'&live=1&chrome=off';
  // The static topology is the VISIBLE model figure — it always renders, live
  // server or not (a downloaded standalone report has no reachable loom route,
  // so a live iframe would just be a blank box). The interactive loom is an
  // opt-in enhancement tucked behind a <details> for deployments served
  // alongside the loom bundle.
  return `<figure class="loom-embed">
      <div class="kicker" style="margin-bottom:6px">Model — bigraph of <span class="mono">${esc(cid)}</span></div>
      ${topo}
      <figcaption>The composite's bigraph (processes, stores, and their wiring).
        <details class="loom-fallback"><summary>open the interactive bigraph-loom view</summary>
          <div class="loom-frame"><iframe class="loom-iframe" title="bigraph-loom — ${esc(cid)}" src="${esc(src)}" loading="lazy"></iframe></div>
        </details></figcaption>
    </figure>`;
}
// PRIMARY Model view (published bundle only): the REAL bigraph-loom, embedded
// chromeless + stripped (?embed=1) and driven by the composite-state snapshot
// that ships beside the report. This is the genuine loom renderer — process
// rectangles, store circles, the place-graph nesting and wiring, click a process
// for its contract — not a re-drawing. The two base URLs come from the DATA
// (INV.loom_embed), set only when publishing alongside the loom bundle; a
// standalone/self-contained report has no INV.loom_embed, so this returns '' and
// the Model section falls back to the inlined image / static topology.
// setupRealLooms() mounts it lazily and, if it can't boot, reveals the fallback.
function loomRealEmbed(s){
  const le=INV.loom_embed; if(!le||!le.loom||!le.state) return '';
  const cid=(s.model_topology&&s.model_topology.composite)||(s.baseline&&s.baseline[0]&&s.baseline[0].composite);
  if(!cid) return '';
  const stateUrl=le.state+encodeURIComponent(cid)+'.json';
  const src=le.loom+'?embed=1&static=1&stateUrl='+encodeURIComponent(stateUrl)+'&tab=explore';
  const fb=(s.model_loom
      ? `<div class="loom-frame" style="height:auto;max-height:640px;overflow:auto"><img src="${s.model_loom}" alt="bigraph-loom view of ${esc(cid)}" style="width:100%;display:block"/></div>`
      : (s.model_topology?loomTopoSVG(s.model_topology):''))||'';
  const id='loomreal'+(++_ILOOM_SEQ);
  return `<figure class="loom-embed loom-real" id="${id}" data-loomsrc="${esc(src)}">
      <div class="loom-real-slot"><div class="loom-real-boot">loading bigraph-loom…</div></div>
      <div class="loom-real-fallback" hidden>${fb}</div>
      <figcaption><b>bigraph-loom</b> — <span class="mono">${esc(cid)}</span>: the composite's process-bigraph (process rectangles, store nodes, and their wiring). Click a process for its contract; drag to pan, scroll to zoom.</figcaption>
    </figure>`;
}
const has = v => v!=null && !(Array.isArray(v)&&!v.length) && !(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);

/* ---------- helpers ---------- */
function statusChip(kind){
  const map={pass:['pass','Passed'],fail:['fail','Refuted'],warn:['warn','Open'],planned:['planned','Planned']};
  const [c,l]=map[kind]||map.warn; return `<span class="status ${c}"><span class="g"></span>${l}</span>`;
}
function gateOf(s){ // pass / fail / planned / warn
  const g = (s.sourcing&&s.sourcing.audit&&s.sourcing.audit.gate) || s.gate_status;
  if(g==='pass'||g==='passed') return 'pass';
  if(g==='fail'||g==='failed') return 'fail';
  // Not yet gated: a study the author marks Planned (or with no run at all) is
  // DESIGNED-not-run — a distinct state from an evaluated-but-open gate, so the
  // report never paints a not-yet-run study as if it had passed. Prefer the
  // server's canonical execution_status (study_ontology) over guessing from the
  // absence of runs.
  const ex=String(s.execution_status||'').toLowerCase();
  if(ex==='planned'||ex==='proposed') return 'planned';
  const c=(s.confidence||'').toLowerCase();
  if(c==='planned') return 'planned';
  if(!ex && !s.gate_status && !(s.runs&&s.runs.length)) return 'planned';
  return 'warn';
}
/* ---------- citation chips (provenance → References) ---------- */
let REFS={};
function refChip(key){
  if(!key) return '';
  const r=REFS[key]; const lbl=(r&&r.label)||key;
  const title=r&&r.title?` title="${esc(r.title)}"`:'';
  return `<a class="refchip${r?'':' unknown'}" href="#ref-${esc(key)}"${title}>${esc(lbl)}</a>`;
}
function citeRow(keys,label){
  const ks=(keys||[]).filter(Boolean);
  if(!ks.length) return '';
  return `<span class="citerow">${label?`<span class="cite-lbl">${esc(label)}</span>`:''}${ks.map(refChip).join('')}</span>`;
}
function isControl(s){ return gateOf(s)==='fail' && (s.confidence==='Refuted'||s.confidence==='Accepted') && !!s.conclusion; }
function loopOutcome(s){
  const r=(s.runs||[]).map(r=>r.outcomes&&r.outcomes['LOOP-OUTCOME']).find(Boolean);
  return r||null;
}

/* ---------- SVG visualizations ---------- */
// V1 capability coverage matrix: rows=requires, cols=chosen modules(+build-new), fill where provided
function vizCapMatrix(s,inv){
  const req=s.requires||[]; const mods=(s.sourcing&&s.sourcing.modules)||[];
  const cat=inv.catalog||{};
  if(!req.length) return '';
  const cols = mods.length?mods:['(build-new)'];
  const cw=Math.max(96,...cols.map(c=>c.length*7.2+24)), rh=30, lh=150, top=54;
  const W=lh+cols.length*cw+16, H=top+req.length*rh+10;
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12.5">`;
  cols.forEach((c,i)=>{ const x=lh+i*cw+cw/2;
    sv+=`<text x="${x}" y="20" text-anchor="middle" font-weight="600" fill="var(--ink)">${esc(c)}</text>`;
    sv+=`<text x="${x}" y="36" text-anchor="middle" fill="var(--ink-3)" font-size="10">provides</text>`;});
  req.forEach((r,ri)=>{ const y=top+ri*rh;
    const covered=cols.some(c=>(cat[c]||[]).includes(r));
    sv+=`<text x="${lh-12}" y="${y+rh/2+4}" text-anchor="end" fill="${covered?'var(--ink)':'var(--fail)'}" font-weight="${covered?400:700}">${esc(r)}</text>`;
    cols.forEach((c,ci)=>{ const x=lh+ci*cw, provides=(cat[c]||[]).includes(r);
      sv+=`<rect x="${x+6}" y="${y+4}" width="${cw-12}" height="${rh-9}" rx="5" fill="${provides?'var(--accent)':'var(--sunken)'}" stroke="${provides?'none':'var(--line)'}"/>`;
      if(provides) sv+=`<text x="${x+cw/2}" y="${y+rh/2+4}" text-anchor="middle" fill="var(--surface)" font-size="11" font-weight="700">✓</text>`;
    });
    if(!covered) sv+=`<rect x="${lh-4}" y="${y+2}" width="${cols.length*cw+4}" height="${rh-4}" rx="6" fill="none" stroke="var(--fail)" stroke-dasharray="4 3"/>`;
  });
  sv+=`</svg>`;
  const uncovered=req.filter(r=>!cols.some(c=>(cat[c]||[]).includes(r)));
  const cap=uncovered.length? `Required capability <span class="mono">${esc(uncovered.join(', '))}</span> is not provided by the chosen module — the coverage argument <span class="mono">requires ⊆ provided</span> fails, and the audit refuses the reuse.`
    : `Every required capability is provided by the chosen module(s): <span class="mono">requires ⊆ provided</span> holds.`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>${cap}</figcaption></figure>`;
}
// V3 audit axes chips
function vizAuditAxes(s){
  const ax=s.sourcing&&s.sourcing.audit&&s.sourcing.audit.axes; if(!ax) return '';
  const order=['source_fit','reinvention','novelty_justified','survey_recorded'];
  let chips=order.filter(k=>k in ax).map(k=>{ const ok=ax[k]==='within_tol';
    return `<span class="chip ${ok?'pass':'fail'}">${ok?'✓':'✗'} ${k.replace(/_/g,' ')}</span>`;}).join('');
  const catches=s.sourcing.audit.catches_if_wrong;
  return `<div class="chiprow" style="margin-top:4px">${chips}</div>`+
    (catches?`<div class="kv rationale" style="margin-top:8px"><b>Catches if wrong:</b> ${esc(catches)}</div>`:'');
}
// V2 sourcing decision map (investigation)
function vizDecisionMap(inv){
  const lanes=['reuse','compose','build-new'];
  const studies=inv.studies.filter(s=>s.sourcing);
  if(!studies.length) return '';
  const laneH=76, top=20, W=940, padL=104;
  const H=top+lanes.length*laneH+10;
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12.5">`;
  lanes.forEach((ln,li)=>{ const y=top+li*laneH;
    sv+=`<text x="8" y="${y+laneH/2}" fill="var(--ink-2)" font-weight="700" font-size="11" letter-spacing=".06em">${ln.toUpperCase()}</text>`;
    sv+=`<line x1="${padL-14}" y1="${y+laneH-1}" x2="${W-10}" y2="${y+laneH-1}" stroke="var(--line)"/>`;
    const inLane=studies.filter(s=>s.sourcing.decision===ln);
    const gap=(W-padL-20)/Math.max(inLane.length,1);
    inLane.forEach((s,si)=>{ const gate=gateOf(s), fail=gate==='fail';
      const x=padL+si*gap+gap/2-70, cx=x+70, cy=y+laneH/2-4, bw=150, bh=46;
      sv+=`<a href="#s-${s.slug}">`;
      sv+=`<rect x="${cx-bw/2}" y="${cy-bh/2}" width="${bw}" height="${bh}" rx="9" fill="var(--surface)" stroke="${fail?'var(--fail)':'var(--line-2)'}" stroke-width="${fail?1.5:1}" ${fail?'stroke-dasharray="5 3"':''}/>`;
      sv+=`<text x="${cx}" y="${cy-3}" text-anchor="middle" fill="var(--ink)" font-weight="600" font-size="12.5">${esc(s.title.replace(/^Trap /,''))}</text>`;
      const mods=(s.sourcing.modules||[]).join(' + ')||'new module';
      sv+=`<text x="${cx}" y="${cy+13}" text-anchor="middle" fill="var(--ink-3)" font-size="10.5" font-family="var(--mono)">${esc(mods)}</text>`;
      sv+=`<circle cx="${cx+bw/2-11}" cy="${cy-bh/2+11}" r="7" fill="${fail?'var(--fail)':'var(--pass)'}"/>`;
      sv+=`<text x="${cx+bw/2-11}" y="${cy-bh/2+14.5}" text-anchor="middle" fill="var(--surface)" font-size="9" font-weight="700">${fail?'✗':'✓'}</text>`;
      if(fail) sv+=`<text x="${cx}" y="${cy+bh/2+13}" text-anchor="middle" fill="var(--warn)" font-size="9.5" font-weight="700">⚑ ADVERSARIAL CONTROL</text>`;
      sv+=`</a>`;
    });
  });
  sv+=`</svg>`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>Every sourcing decision placed in its lane; the node's badge is the audit gate. The dashed node is the deliberate trap — a plausible reuse the audit correctly refuses.</figcaption></figure>`;
}
// V6 agent-vs-policy outcome bar (investigation)
function vizOutcomeBar(inv){
  const rows=inv.studies.map(s=>{
    const at=s.agent_trajectory, pt=s.policy_trajectory;
    return {s, agent:at&&at.result, policy:pt&&pt.result};
  }).filter(r=>r.agent||r.policy);
  if(!rows.length) return '';
  const rh=46, top=30, padL=150, W=940, maxE=Math.max(1,...rows.flatMap(r=>[r.agent&&r.agent.edits||0,r.policy&&r.policy.edits||0]));
  const barMax=W-padL-150, unit=barMax/Math.max(maxE,3);
  const H=top+rows.length*rh+8;
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12">`;
  sv+=`<text x="${padL}" y="18" fill="var(--ink-2)" font-size="10.5" font-weight="700">AGENT ▲  /  POLICY ▼   ·   bar = edits, terminal chip = outcome</text>`;
  rows.forEach((r,ri)=>{ const y=top+ri*rh;
    sv+=`<a href="#s-${r.s.slug}"><text x="${padL-12}" y="${y+rh/2}" text-anchor="end" fill="var(--ink)" font-weight="600" font-size="12.5">${esc(r.s.title)}</text></a>`;
    [['agent',r.agent,-1],['policy',r.policy,1]].forEach(([k,res,dir])=>{
      if(!res) return; const cy=y+rh/2+dir*10;
      const done=res.state==='DONE'; const w=Math.max(unit*(res.edits||0),6);
      sv+=`<rect x="${padL}" y="${cy-6}" width="${w}" height="12" rx="6" fill="${done?'var(--accent)':'var(--sunken)'}" stroke="${done?'none':'var(--line-2)'}"/>`;
      const chx=padL+w+8;
      sv+=`<text x="${chx}" y="${cy+4}" fill="${done?'var(--pass)':'var(--fail)'}" font-weight="700" font-size="11">${done?'✓ DONE':'✗ GIVE-UP'} · ${res.edits} edit${res.edits==1?'':'s'}</text>`;
    });
  });
  sv+=`</svg>`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>Head-to-head across every task: the LLM agent (upper lane) reaches DONE where the deterministic policy (lower lane) gives up. Bar length is the number of model edits taken.</figcaption></figure>`;
}
// V4 margin ladder (study, build)
function vizMarginLadder(traj){
  if(!traj||!traj.iterations||!traj.iterations.length) return '';
  const its=traj.iterations, tests=(its[0].tests||[]).map(t=>t.id);
  if(!tests.length) return '';
  const cw=Math.max(52,(700-160)/its.length), rh=34, top=40, padL=160;
  const W=padL+its.length*cw+10, H=top+tests.length*rh+16;
  const maxAbs=Math.max(1,...its.flatMap(it=>(it.tests||[]).map(t=>Math.abs(t.margin||0))));
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12">`;
  its.forEach((it,i)=>{ const x=padL+i*cw+cw/2;
    sv+=`<text x="${x}" y="20" text-anchor="middle" fill="var(--ink-2)" font-size="10.5" font-weight="600">iter ${it.iteration}</text>`;
    sv+=`<text x="${x}" y="33" text-anchor="middle" fill="var(--ink-3)" font-size="9.5">${it.n_pass}/${it.n_hard}</text>`;});
  tests.forEach((tid,ri)=>{ const y=top+ri*rh;
    const lbl=(its[0].tests[ri].label)||tid;
    sv+=`<text x="${padL-12}" y="${y+rh/2+4}" text-anchor="end" fill="var(--ink)" font-size="11.5">${esc(lbl.length>26?lbl.slice(0,25)+'…':lbl)}</text>`;
    its.forEach((it,ci)=>{ const t=(it.tests||[])[ri]; if(!t) return; const x=padL+ci*cw;
      const ok=t.verdict==='within_tol'; const op=(0.28+0.72*Math.min(1,Math.abs(t.margin||0)/maxAbs)).toFixed(2);
      const isLast=ci===its.length-1;
      sv+=`<rect x="${x+5}" y="${y+4}" width="${cw-10}" height="${rh-9}" rx="5" fill="${ok?'var(--pass)':'var(--fail)'}" fill-opacity="${ok?0.9:op}" stroke="${isLast?'var(--ink)':'none'}" stroke-width="${isLast?1.4:0}"/>`;
      const fixed=(it.newly_fixed||[]).includes(tid);
      if(fixed) sv+=`<text x="${x+cw/2}" y="${y+rh/2+4}" text-anchor="middle" fill="var(--surface)" font-size="12" font-weight="700">✦</text>`;
    });
  });
  sv+=`</svg>`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>Each locked test (row) across build iterations (columns); green = passing, red = failing (deeper = larger margin from the bar). <b>✦</b> marks the iteration a test was newly fixed; the ringed column is the final model.</figcaption></figure>`;
}
// V5 iteration timeline
function timelineSteps(traj){
  if(!traj||!traj.iterations) return '';
  const steps=traj.iterations.map(it=>{
    const d=it.decision||{}; const act=d.action||d.kind||'';
    let label=act;
    if(d.mechanism) label='install '+d.mechanism;
    else if(d.value) label=(d.action||'')+' '+d.value;
    else if(act==='done') label='DONE';
    else if(act==='blocked'||act==='install') label=act;
    const reason=d.reasoning||d.note||'';
    return {it:it.iteration,label,reason,np:it.n_pass,nh:it.n_hard};
  });
  let html='<div style="margin-top:6px">';
  steps.forEach((s,i)=>{
    const pct=s.nh?Math.round(100*s.np/s.nh):0;
    html+=`<div class="reasoning-step" style="display:flex;gap:10px;align-items:baseline;padding:4px 0">
      <span class="mono" style="color:var(--ink-3);min-width:34px">i${s.it}</span>
      <span style="font-weight:600;min-width:180px">${esc(s.label)}</span>
      <span style="flex:1;height:6px;background:var(--sunken);border-radius:4px;overflow:hidden;max-width:160px">
        <span style="display:block;height:100%;width:${pct}%;background:var(--accent)"></span></span>
      <span class="mono" style="color:var(--ink-2);font-size:11px">${s.np}/${s.nh}</span></div>`;
    if(s.reason) html+=`<div class="kv rationale" style="margin:0 0 6px 44px;font-size:12.5px">${esc(s.reason)}</div>`;
  });
  html+='</div>';
  return html;
}

/* ---------- V7 gate matrix (investigation) : tests × studies ---------- */
function vizGateMatrix(inv){
  const studies=inv.studies.filter(s=>s.agent_trajectory&&s.agent_trajectory.iterations&&s.agent_trajectory.iterations.length);
  if(studies.length<2) return '';
  // union of test ids is heterogeneous across tasks; instead show pass-count per study as a compact dot bar
  const rh=30, top=24, padL=150, W=760;
  const H=top+studies.length*rh+10, maxN=Math.max(...studies.map(s=>lastIt(s).n_hard||1));
  const cell=Math.min(26,(W-padL-40)/maxN);
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12">`;
  sv+=`<text x="${padL}" y="16" fill="var(--ink-2)" font-size="10.5" font-weight="700">FINAL TEST OUTCOMES · one square per locked test</text>`;
  studies.forEach((s,ri)=>{ const y=top+ri*rh, it=lastIt(s), ts=it.tests||[];
    sv+=`<a href="#s-${s.slug}"><text x="${padL-12}" y="${y+rh/2+4}" text-anchor="end" fill="var(--ink)" font-weight="600" font-size="12">${esc(s.title)}</text></a>`;
    ts.forEach((t,ci)=>{ const ok=t.verdict==='within_tol'; const x=padL+ci*(cell+4);
      sv+=`<rect x="${x}" y="${y+3}" width="${cell}" height="${cell}" rx="4" fill="${ok?'var(--pass)':'var(--fail)'}" fill-opacity="${ok?.9:.5}"><title>${esc(t.label||t.id)}: ${ok?'pass':'fail'}</title></rect>`;
    });
    sv+=`<text x="${padL+ts.length*(cell+4)+8}" y="${y+rh/2+4}" fill="var(--ink-2)" font-size="11" font-weight="600">${it.n_pass}/${it.n_hard}</text>`;
  });
  sv+=`</svg>`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>Every task's final model against its own locked acceptance tests — the agent drives each to a full green row.</figcaption></figure>`;
}
function lastIt(s){const its=s.agent_trajectory.iterations;return its[its.length-1];}

/* ---------- model diagram (the "model SVG") ---------- */
function modelText(s){ const cm=(s.conclusion||'').match(/##\s*Final model\s*([\s\S]*?)(?:\n##|$)/i);
  return (cm?cm[1].trim():'')||s.biological_summary||''; }
function vizModelSVG(s, inv){
  if(s.sourcing){
    const mods=(s.baseline||[]).filter(b=>b.module||b.name);
    const boxes=mods.length?mods:[{name:'new module',domain:'built for this task'}];
    const bw=200,bh=58,gap=30,padT=54,x0=20;
    const W=Math.max(560,x0+boxes.length*(bw+gap)), H=padT+bh+58;
    let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12.5">`;
    // task node
    sv+=`<rect x="${x0}" y="14" width="${(s.requires||[]).length?260:180}" height="28" rx="8" fill="var(--sunken)" stroke="var(--line)"/>`;
    sv+=`<text x="${x0+12}" y="32" fill="var(--ink-2)" font-size="11">task requires: <tspan fill="var(--ink)" font-family="var(--mono)">${esc((s.requires||[]).join(', '))}</tspan></text>`;
    boxes.forEach((b,i)=>{ const x=x0+i*(bw+gap), y=padT;
      sv+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="10" fill="var(--surface)" stroke="var(--accent)"/>`;
      sv+=`<text x="${x+bw/2}" y="${y+24}" text-anchor="middle" fill="var(--ink)" font-weight="700" font-family="var(--mono)" font-size="13">${esc(b.name)}</text>`;
      sv+=`<text x="${x+bw/2}" y="${y+42}" text-anchor="middle" fill="var(--ink-2)" font-size="11">${esc((b.domain||'').slice(0,34))}</text>`;
      sv+=`<line x1="${x+bw/2}" y1="42" x2="${x+bw/2}" y2="${y}" stroke="var(--line-2)" stroke-width="1.5" marker-end="url(#ar)"/>`;
      if(i>0) sv+=`<line x1="${x-gap}" y1="${y+bh/2}" x2="${x}" y2="${y+bh/2}" stroke="var(--line-2)" stroke-dasharray="3 3"/>`;
    });
    sv+=`<text x="${x0}" y="${H-14}" fill="var(--ink-3)" font-size="11">${esc(s.sourcing.decision)} · ${boxes.length>1?'composed':'single module'}</text>`;
    sv+=`<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--line-2)"/></marker></defs></svg>`;
    return `<figure><div class="fig-scroll">${sv}</div><figcaption>The sourced model: ${boxes.length>1?'the composed modules':'the reused module'} that supply the task's required capabilities.</figcaption></figure>`;
  }
  // agentic: extract CamelCase process names + stores from the final-model text
  const text=modelText(s);
  const procs=[...new Set((text.match(/\b[A-Z][a-z]+(?:[A-Z][a-z0-9]+)+\b/g)||[]))]
    .filter(p=>!/^(Composite|Process|Hill|Cellular|Potts|Rust|Monod|ParCa|Wnt)$/.test(p)).slice(0,6);
  const sm=text.match(/over ([a-z0-9_\/ ,]+)/i);
  const stores=sm?sm[1].split(/[\/,]/).map(x=>x.trim()).filter(Boolean).slice(0,6):[];
  if(!procs.length){ // fallback: single composite box
    const bl=(s.baseline||[])[0];
    return `<figure><div class="kv mono texp">${esc(bl&&bl.composite||'process-bigraph Composite')}</div><figcaption>${esc(text||'A process-bigraph Composite run through the engine.')}</figcaption></figure>`;
  }
  const bw=Math.max(120,...procs.map(p=>p.length*8+24)),bh=42,gap=24,x0=16,padT=24;
  const rowW=x0+procs.length*(bw+gap), storeY=padT+bh+40;
  const W=Math.max(560,rowW), H=stores.length?storeY+40:padT+bh+30;
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12.5">`;
  sv+=`<text x="${x0}" y="16" fill="var(--ink-3)" font-size="10.5" letter-spacing=".06em">PROCESSES</text>`;
  procs.forEach((p,i)=>{ const x=x0+i*(bw+gap), y=padT;
    sv+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="9" fill="var(--surface)" stroke="var(--accent)"/>`;
    sv+=`<text x="${x+bw/2}" y="${y+bh/2+4}" text-anchor="middle" fill="var(--ink)" font-weight="700" font-family="var(--mono)" font-size="12">${esc(p)}</text>`;
    if(i>0) sv+=`<line x1="${x-gap}" y1="${y+bh/2}" x2="${x}" y2="${y+bh/2}" stroke="var(--line-2)" marker-end="url(#ar2)"/>`;
    if(stores.length) sv+=`<line x1="${x+bw/2}" y1="${y+bh}" x2="${x+bw/2}" y2="${storeY}" stroke="var(--line)" stroke-dasharray="2 3"/>`;
  });
  if(stores.length){
    sv+=`<text x="${x0}" y="${storeY-8}" fill="var(--ink-3)" font-size="10.5" letter-spacing=".06em">STORES</text>`;
    let sx=x0; stores.forEach(st=>{ const w=st.length*7.5+20;
      sv+=`<rect x="${sx}" y="${storeY}" width="${w}" height="26" rx="13" fill="var(--sunken)" stroke="var(--line)"/>`;
      sv+=`<text x="${sx+w/2}" y="${storeY+17}" text-anchor="middle" fill="var(--ink-2)" font-family="var(--mono)" font-size="11">${esc(st)}</text>`; sx+=w+10; });
  }
  sv+=`<defs><marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--line-2)"/></marker></defs></svg>`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>The process-bigraph Composite the agent built: ${procs.length} process${procs.length>1?'es':''}${stores.length?` wired over ${stores.length} shared stores`:''}, run through the engine.</figcaption></figure>`;
}

/* ---------- block renderers (spine) ---------- */
// dense tests / report-card table: description, machine criterion, provenance, final verdict + observed + margin
function testsTable(tests, traj){
  let finals={}, prov={};
  if(traj){
    if(traj.iterations&&traj.iterations.length)
      (traj.iterations[traj.iterations.length-1].tests||[]).forEach(t=>finals[t.id]={v:t.verdict,exp:t.expected,obs:t.observed,m:t.margin});
    (traj.tests||[]).forEach(t=>{prov[t.id]={exp:t.expected,provenance:t.provenance,label:t.label};});
  }
  const rows=(tests||[]).map(t=>{
    const name=t.name||t.id, desc=t.description||t.label||(prov[name]&&prov[name].label)||'';
    const meas=t.measure&&(t.measure.path||t.measure.observable||t.measure.kind);
    const cls=t.classification;
    const fin=finals[name]; const v=fin?(fin.v==='within_tol'?'pass':'fail'):null;
    const exp=(fin&&fin.exp)||(prov[name]&&prov[name].exp)||(t.pass_if&&(t.pass_if.op+' '+t.pass_if.value))||'';
    const pv=provText((prov[name]&&prov[name].provenance))||provText(t.pass_if&&t.pass_if.provenance)||(t.measure&&t.measure.kind==='audit-axis'?('audit axis '+meas):'');
    const obs=(fin&&fin.obs!=null)?`observed ${fmt(fin.obs)}`:'';
    const mg=(fin&&fin.m!=null)?` · margin ${fmt(fin.m)}`:'';
    return `<tr id="test-${esc(name)}"><td class="tname">${esc(desc||name)}
        <div class="texp mono">${esc(name)}${cls?' · '+esc(cls):''}${meas?' · '+esc(meas):''}</div>
        ${pv?`<div class="kv rationale" style="font-size:12px;margin-top:3px">${esc(pv)}</div>`:''}</td>
      <td class="tv"><div>${exp?`<span class="mono texp">${esc(exp)}</span>`:''} ${v?`<span class="chip ${v}" style="margin-left:6px">${v==='pass'?'✓ pass':'✗ fail'}</span>`:'<span class="chip">pending</span>'}</div>
        ${obs?`<div class="texp mono" style="margin-top:3px">${esc(obs)}${esc(mg)}</div>`:''}</td></tr>`;
  }).join('');
  return `<table class="ttable">${rows}</table>`;
}
function fmt(n){ if(typeof n!=='number') return esc(n); return Number.isInteger(n)?n:(Math.abs(n)<0.01?n.toExponential(1):n.toFixed(2)); }
// provenance may be a plain string OR an object ({kind, note, ...}); render a
// readable line, never a stringified object ("[object Object]").
function provText(p){ if(!p) return ''; if(typeof p==='string') return p;
  if(typeof p==='object') return String(p.note||p.rationale||p.kind||Object.values(p).filter(v=>typeof v==='string').join(' · ')||''); return String(p); }

// Legacy inline bubble — superseded by the shared feedback engine
// (static/study-feedback.js, inlined near the end of this document), which
// decorates every `.fbsection` / study card with a hover-corner. Kept as a
// no-op so the render markup (which still calls it) stays intact.
function fbBubble(key,label){ return ''; }
function part(label, body, key, klabel){ if(!body) return '';
  return `<div class="substage fbsection">${key?fbBubble(key,klabel||label):''}<div class="slabel">${label}</div>${body}</div>`; }

// Render a limitation / follow-up entry that may be a plain string OR a
// single-key {title: detail} map (the authored shapes in study.yaml).
function _debtText(x){
  if(x==null) return '';
  if(typeof x==='string') return mdLite(x);
  if(typeof x==='object'){
    const k=Object.keys(x);
    if(k.length===1) return `<b>${esc(k[0])}</b> — ${mdLite(String(x[k[0]]))}`;
    if(x.study||x.proposal||x.title) return `<b>${esc(x.study||x.title||'')}</b>${(x.proposal||x.rationale||x.reason)?' — '+mdLite(String(x.proposal||x.rationale||x.reason)):''}`;
    return esc(JSON.stringify(x));
  }
  return esc(String(x));
}

// traceability anchor built via the prefix helper (assembled, not a hardcoded
// href), so a finding's from_test resolves to its test-card anchor
function _traceLink(prefix, name){ return '<a class="trace-link" href="#' + prefix + '-' + esc(name) + '">' + esc(name) + '</a>'; }

// a copy-to-run command chip; '' for a falsy command (older payloads / static bundle)
function _runChip(cmd){ if (!cmd) return ''; return '<code class="run-chip" title="copy to run">' + esc(cmd) + '</code>'; }

// per-outcome rows separating the AUTHORED result from the COMPUTED/measured
// value (divergence badged), instead of a raw key:value dump
function outcomeRows(outcomes){
  return Object.entries(outcomes||{}).map(([k,o])=>{
    o=o||{}; const authored=o.result;
    const computed=(o.computed!=null?o.computed:o.measured_value);
    const diverge=(computed!=null && String(computed)!==String(authored));
    return `<div class="computed-outcome-row"><span class="mono" style="color:var(--ink-2)">${esc(k)}</span>
      <span class="outcome-chip-authored chip">authored: ${esc(authored)}</span>
      ${computed!=null?`<span class="outcome-chip-computed chip ${diverge?'reconcile-divergent':''}">computed: ${esc(computed)}</span>`:''}
      ${o.detail?`<span class="texp" style="margin-left:6px">${esc(o.detail)}</span>`:''}</div>`;
  }).join('');
}

// (The former four-part sciUnit() was superseded by the §7 figure-first card
// slots in renderStudy; its field helpers _experimentOf/_observableOf/_whatWeLearn
// are still used there and in studySummary.)

// "Methods · Simulations" node-card block — matches the locked SHARED spec used by
// the live workbench graph's study card (same rows + fidelity vocabulary + CSS
// class hooks), so the live graph and this published report read 1:1. Model / Sims
// / Tests render off the study's existing data now; the Methods row + fidelity chip
// populate from s.methods / s.fidelity (process-bigraph composite_generator
// methods=/fidelity=) once that field lands — until then they omit, data-safe.
function methodsSimsBlock(s){
  const comp=s.baseline_composite||'';
  const compName=comp?String(comp).split('.').pop():'';
  const methods=Array.isArray(s.methods)?s.methods.filter(Boolean):[];
  const fid=s.fidelity;
  const runs=Array.isArray(s.runs)?s.runs:[];
  const last=runs.length?runs[runs.length-1]:null;
  const rstatus=last?(last.status||s.simulation_status||''):(s.simulation_status||'');
  const nsteps=last?(last.n_steps||last.steps||''):'';
  const tc=s.tests_counts||{}; const pass=tc.passed||0, fail=tc.failed||0, skip=tc.skipped||0; const tot=pass+fail+skip;
  const rows=[];
  if(compName){
    const chip=fid?`<span class="aig-fidelity-chip aig-fidelity-${fid==='real'?'real':'repro'}">${fid==='real'?'real tool':'reproduction'}</span>`:'';
    rows.push(`<div class="aig-methods-row"><span class="aig-methods-label">Model</span><span class="aig-methods-val"><span class="mono">${esc(compName)}</span>${chip}</span></div>`);
  }
  if(methods.length)
    rows.push(`<div class="aig-methods-row"><span class="aig-methods-label">Methods</span><span class="aig-methods-val">${esc(methods.join(' · '))}</span></div>`);
  if(runs.length||rstatus||nsteps){
    const bits=[runs.length+' run'+(runs.length===1?'':'s')];
    if(rstatus) bits.push(esc(String(rstatus)));
    if(nsteps) bits.push(esc(String(nsteps))+' steps');
    rows.push(`<div class="aig-methods-row"><span class="aig-methods-label">Sims</span><span class="aig-methods-val">${bits.join(' · ')}</span></div>`);
  }
  if(tot){
    const glyphs=('✓'.repeat(Math.min(pass,16)))+(fail?('✗'.repeat(Math.min(fail,16))):'');
    rows.push(`<div class="aig-methods-row"><span class="aig-methods-label">Tests</span><span class="aig-methods-val${fail===0?' allpass':''}">${glyphs} ${pass}/${tot} passed</span></div>`);
  }
  return rows.length?`<div class="aig-methods-block"><div class="aig-methods-head">Methods · Simulations</div>${rows.join('')}</div>`:'';
}

// high-level overview shown when a study is COLLAPSED
function studySummary(s, inv){
  const chips=[];
  if(s.sourcing){
    chips.push(`<span class="chip decision">${esc(s.sourcing.decision)}</span>`);
    (s.sourcing.modules||[]).forEach(m=>chips.push(`<span class="chip mod">${esc(m)}</span>`));
    const ax=s.sourcing.audit&&s.sourcing.audit.axes;
    if(ax){ const ok=Object.values(ax).filter(v=>v==='within_tol').length; chips.push(`<span class="chip">audit ${ok}/${Object.keys(ax).length} axes</span>`); }
  } else {
    const a=s.agent_trajectory&&s.agent_trajectory.result, p=s.policy_trajectory&&s.policy_trajectory.result;
    if(a) chips.push(`<span class="chip ${a.state==='DONE'?'pass':'fail'}">agent ${a.state==='DONE'?'✓ '+a.edits+'e':'✗'}</span>`);
    if(p) chips.push(`<span class="chip ${p.state==='DONE'?'pass':'fail'}">policy ${p.state==='DONE'?'✓':'✗ give-up'}</span>`);
    const it=s.agent_trajectory&&lastIt(s); if(it) chips.push(`<span class="chip">tests ${it.n_pass}/${it.n_hard}</span>`);
  }
  // evidence tier of the study's headline finding — so the collapsed card already
  // distinguishes an observed result from a hypothetical one.
  const tier=(Array.isArray(s.findings)&&s.findings.length)?evidenceTier(s.findings[0],s):null;
  const runN=(s.runs||[]).length; if(runN) chips.push(`<span class="chip">${runN} run${runN>1?'s':''}</span>`);
  const nfig=(s.figures_embedded||[]).filter(f=>f.data_uri||f.html).length; if(nfig) chips.push(`<span class="chip">${nfig} figure${nfig>1?'s':''}</span>`);
  const nfind=Array.isArray(s.findings)?s.findings.length:0; if(nfind) chips.push(`<span class="chip">${nfind} finding${nfind>1?'s':''}</span>`);
  if(tier) chips.push(etierBadge(tier));
  // the collapsed snippet is "what we learn" (claim / top finding), since the
  // scientific QUESTION is already the card's serif lead above.
  let learn=_whatWeLearn(s);
  const snip=String(learn).split(/(?<=[.!?])\s/).slice(0,2).join(' ');
  return `<div class="summary-chips">${chips.join('')}</div>${snip?`<div class="summary-snip"><span class="ek" style="color:var(--ink-3);font-weight:600">What we learn — </span>${esc(snip)}</div>`:''}`;
}

function renderStudy(s, inv, idx){
  const gate=gateOf(s), fail=gate==='fail', planned=gate==='planned', control=isControl(s), lo=loopOutcome(s);
  const dchip=fail?'fail':(planned?'planned':'pass');

  // LEAD WITH THE QUESTION — the scientific question is the study's headline,
  // before any model / implementation detail (falls back to purpose.question,
  // then the claim, so a question-less study still leads with something).
  const pq = s.purpose && s.purpose.question, pm = s.purpose && s.purpose.mechanism;
  const question = s.question || pq || s.claim;
  const claimLine = question? `<div class="claim">${esc(question)}</div>` : '';
  const bioText = s.biological_summary || pm;
  const overview = bioText?`<div class="biology">${esc(bioText)}</div>`:'';

  // MODEL — prefer a pre-rendered bigraph-loom image (offline-safe, config
  // loaded, from `vivarium-workbench render-loom`); else the live loom iframe;
  // else the re-drawn static topology / viz.
  const bl=(s.baseline||[])[0];
  const _mcid=(s.model_topology&&s.model_topology.composite)||(bl&&bl.composite)||'';
  const loomRendered = s.model_loom
    ? `<figure class="loom-embed"><div class="loom-frame" style="height:auto;max-height:640px;overflow:auto">
         <img src="${s.model_loom}" alt="bigraph-loom view of ${esc(_mcid)}" style="width:100%;display:block"/></div>
       <figcaption><b>bigraph-loom</b> view of <span class="mono">${esc(_mcid)}</span> — the composite's bigraph with its config loaded.</figcaption></figure>`
    : '';
  // The report is a self-contained document (often opened from disk / a static
  // bundle), so the Model section uses only renderings that need no network:
  // the pre-rendered bigraph-loom PNG (render-loom) when the composite has one,
  // else the static bigraph topology drawn from model_topology, then a plain viz.
  // (The live loom iframe and the re-drawn interactive-SVG loom were both removed:
  // the iframe failed offline, and the interactive SVG kept recurring in place of
  // a real loom figure.)
  let modelBody = loomRendered || (s.model_topology ? loomTopoSVG(s.model_topology) : '') || vizModelSVG(s,inv);
  if(s.sourcing){
    modelBody += `<div class="decision-line" style="margin-top:6px"><span class="chip decision">${esc(s.sourcing.decision)}</span>
      ${(s.sourcing.modules||[]).map(m=>`<span class="chip mod">${esc(m)}</span>`).join(' ')||'<span class="chip mod">new module</span>'}</div>
      ${s.sourcing.rationale?`<div class="kv rationale">${esc(s.sourcing.rationale)}</div>`:''}`;
  } else if(bl&&bl.composite){
    modelBody += `<div class="texp mono" style="margin-top:4px">${esc(bl.composite)}</div>`;
  }

  // SIMULATION RUN
  const runs=s.runs||[];
  let runBody = runs.length?runs.map(r=>{
    return `<div class="kv" style="margin:6px 0"><span class="chip ${r.status==='completed'?'pass':''}">${esc(r.status)}</span>
      <span class="mono" style="margin-left:8px;color:var(--ink-2)">${esc(r.name||r.module||'')}</span>
      ${outcomeRows(r.outcomes)}
      ${r.provenance?`<div class="texp mono" style="margin-top:2px">${esc(provText(r.provenance))}</div>`:''}</div>`;
  }).join(''):'';
  // run-command chips: how to reproduce this study + per-variant commands
  if(s.run_commands){
    const _base = s.run_commands && s.run_commands.baseline;
    if(_base) runBody += `<div class="reproduce-line texp" style="margin-top:6px">Reproduce: ${_runChip(_base)}</div>`;
    const _rcVariants = (s.run_commands && s.run_commands.variants) || [];
    _rcVariants.forEach(_vc=>{ runBody += `<div class="texp">${esc(_vc.name)}: ${_runChip(_vc && _vc.cmd)}</div>`; });
  }

  // VISUALIZATIONS — split by the declared `display:` intent (set in the study's
  // visualizations[], carried onto each embedded figure by the report builder):
  // the card LEADS with the decisive figure (display: primary, then mechanism),
  // and everything unmarked (repeated time-series, 3D re-renders, solver traces,
  // reaction catalogs, audit axes, derived ladders) drops into the collapsed
  // technical record below. If NO figure is flagged (older / other workspaces),
  // `anyFigFlagged` is false and every figure renders in one plain Visualizations
  // section — degrade, don't break.
  let primaryFigHtml='', mechFigHtml='', techFigHtml='';
  const anyFigFlagged=(s.figures_embedded||[]).some(im=>im&&im.display);
  // single embedded-figure item → its HTML fragment (image / inline Plotly /
  // iframe HTML / skipped note), the same renderings as before.
  const _figItem=(im)=>{
    if(im.data_uri) return `<figure><img src="${im.data_uri}" alt="${esc(im.name)}" loading="lazy"><figcaption>${esc(im.name)}</figcaption></figure>`;
    // Interactive figure (Plotly): the generator stripped its own Plotly loader
    // and handed us just the graph <div> + its Plotly.newPlot script. Render it
    // INLINE in the main document so it draws with the report's one shared
    // Plotly.js. The script stays inert until setupLazyPlotly() runs it the first
    // time the figure is actually laid out with a real width — so a tab-hidden /
    // collapsed figure is drawn at correct size when revealed, never blank.
    if(im.html && im.interactive) return `<figure class="embedded-viz embedded-plotly" style="margin:12px 0"><figcaption class="kicker" style="margin-bottom:6px">${esc(im.name)}</figcaption><div class="plotly-holder">${im.html}</div></figure>`;
    // Any other committed HTML figure keeps the isolated-iframe path.
    if(im.html) return `<figure class="embedded-viz" style="margin:12px 0"><figcaption class="kicker" style="margin-bottom:6px">${esc(im.name)}</figcaption><iframe class="viz-frame" srcdoc="${esc(im.html)}" loading="lazy" onload="try{this.style.height=(this.contentWindow.document.documentElement.scrollHeight+8)+'px';}catch(e){}"></iframe></figure>`;
    if(im.skipped) return `<div class="texp" style="color:var(--ink-3)">↪ ${esc(im.name)} — ${esc(im.reason||'not inlined')}</div>`;
    return '';
  };
  (s.figures_embedded||[]).forEach(im=>{
    const html=_figItem(im); if(!html) return;
    if(im.display==='primary') primaryFigHtml+=html;
    else if(im.display==='mechanism') mechFigHtml+=html;
    else techFigHtml+=html;
  });
  // derived / audit figures are always technical record (never the decisive figure)
  const dfigs=[];
  if(s.agent_trajectory) dfigs.push(['Margin ladder — LLM agent', vizMarginLadder(s.agent_trajectory)]);
  if(s.policy_trajectory) dfigs.push(['Margin ladder — deterministic policy control', vizMarginLadder(s.policy_trajectory)]);
  if(s.sourcing) dfigs.push(['Capability coverage', vizCapMatrix(s,inv)]);
  techFigHtml = dfigs.filter(f=>f[1]).map(([t,svg])=>`<div style="margin:12px 0"><div class="kicker" style="margin-bottom:6px">${esc(t)}</div>${svg}</div>`).join('') + techFigHtml;
  if(s.sourcing&&s.sourcing.audit&&s.sourcing.audit.axes) techFigHtml+=`<div style="margin:10px 0"><div class="kicker" style="margin-bottom:6px">Audit — sourcing gate (4 axes)</div>${vizAuditAxes(s)}</div>`;
  // the decisive-figure slot: the primary, then any mechanism view
  const decisiveFigBody=(primaryFigHtml+mechFigHtml)||'';

  // TESTS (+ build reasoning for agentic)
  let testsBody = has(s.behavior_tests)?testsTable(s.behavior_tests, s.agent_trajectory):'';
  if(s.agent_trajectory){
    const at=s.agent_trajectory;
    testsBody += `<details class="exp"><summary>How the agent converged — iteration-by-iteration</summary><div class="body">${timelineSteps(at)}`;
    if(at.result&&has(at.result.violations)) testsBody+=`<div class="kv rationale" style="margin-top:8px;color:var(--warn)"><b>Integrity trail:</b> ${at.result.violations.map(esc).join('; ')}</div>`;
    if(s.policy_trajectory){const pr=s.policy_trajectory.result||{};
      testsBody+=`<div class="kv rationale" style="margin-top:8px"><b>Deterministic-policy control:</b> ${pr.state==='DONE'?`also DONE in ${pr.edits} edits`:`gave up after ${pr.edits} edit${pr.edits==1?'':'s'}`}.</div>`;}
    testsBody+=`</div></details>`;
  }

  // FINDINGS (with traceability: from_test anchored to its test card, the cited
  // pass_if band inlined, divergence surfaced, run_ids as plain code, seeded-study back-link)
  let findingsBody='';
  if(Array.isArray(s.findings) && s.findings.length){
    const bands={}, tcites={};
    (s.behavior_tests||[]).forEach(t=>{ const n=t.name||t.id; if(t.pass_if) bands[n]=t.pass_if; if(t.cites) tcites[n]=t.cites; });
    findingsBody=s.findings.map(f=>{
      const ok=(f.status==='passed'||f.status==='pass');
      const ft=f.evidence&&f.evidence.from_test, band=ft&&bands[ft];
      const runIds=(f.provenance&&f.provenance.run_ids)||[];
      const dv=f.divergence_factor;
      // Provenance: a finding's own cites (expected.cites) plus the cites on the
      // test it rests on — the literature the quantitative claim is measured against.
      const fcites=(f.expected&&f.expected.cites)||f.cites||[];
      const bandCites=(ft&&tcites[ft])||[];
      const allCites=[...new Set([...fcites,...bandCites])];
      const tier=evidenceTier(f,s);
      return `<div class="finding-traceability" style="margin:8px 0">
        <span class="chip ${ok?'pass':''}">${esc((f.id?f.id+' · ':'')+(f.status||'finding'))}</span>${tier?' '+etierBadge(tier):''}
        <div class="kv rationale">${esc(f.statement||'')}${allCites.length?' '+citeRow(allCites):''}</div>
        ${ft?`<div class="texp">from test: ${_traceLink('test',ft)}${band?` <span class="pass_if-band mono">${esc((band.op||'')+' '+(band.value!=null?band.value:''))}</span>`:''}${bandCites.length?' '+citeRow(bandCites,'band'):''}</div>`:''}
        ${dv!=null?`<div class="finding-divergence texp">divergence ${esc(dv)}× vs expected</div>`:''}
        ${runIds.length?`<div class="texp">runs: ${runIds.map(r=>`<code>${esc(r)}</code>`).join(' ')}</div>`:''}
        ${f.seeded_study?`<div class="finding-seeded texp">seeded study: ${_traceLink('s',f.seeded_study)}</div>`:''}</div>`;
    }).join('');
  }

  // DECISION  (conclusion, or a conclusion_logic block for pipeline-style studies)
  let conclusion=(s.conclusion||'').replace(/##\s*Final model[\s\S]*?(?=\n##|$)/i,'').replace(/##\s*Result/i,'').trim();
  if(!conclusion && s.conclusion_logic && s.conclusion_logic.if_primary_tests_pass){
    const cl=s.conclusion_logic.if_primary_tests_pass;
    conclusion=[cl.implementation_status, cl.biological_validation].filter(Boolean).join(' ');
  }
  // gate divergence: the code-computed gate verdict vs the authored gate_status
  let gateDiv='';
  const cg=s.computed_gate_verdict;
  if(cg){
    const code=cg.result||'', authored=s.gate_status||'';
    const same=(code===authored)||(code==='passing'&&authored==='passed')||(code==='failing'&&authored==='failed');
    if(cg.diverges_from_authored===true || (code && authored && !same))
      gateDiv=`<div class="sp-gate-divergence chip warn" style="margin-top:8px">⚠ gate divergence — code: ${esc(code)} · authored: ${esc(authored)}</div>`;
  }
  const decVerb=fail?'Gate refused':(planned?'Not yet run':'Gate cleared');
  const decisionBody=`<div class="decbox"><div>${statusChip(dchip)}</div>
    <div><div class="dverdict"><b>${decVerb}</b> · ${esc(s.confidence||'')}${lo?` · <span class="mono">${esc(lo.result)} (${esc(lo.detail||'')})</span>`:''}</div>
    ${conclusion?`<div class="dnarr">${mdLite(conclusion)}</div>`:''}${gateDiv}</div></div>`;

  // PROVENANCE — literature anchors (expectation → observable → source → status,
  // with citation chips linking to the References section) + key assumptions, so
  // every quantitative target traces back to the paper it came from.
  const anchors=s.literature_anchors||[];
  let anchorsBody='';
  if(anchors.length){
    const rows=anchors.map(a=>{
      const met=/\bmet\b/i.test(a.status_in_workspace||'');
      return `<tr><td class="ax-exp">${esc(a.expectation||'')}</td>
        <td class="ax-obs">${esc(a.model_observable||'')}</td>
        <td>${esc(a.source||'')}${citeRow(a.cites)}</td>
        <td class="ax-status ${met?'ax-met':''}">${esc(a.status_in_workspace||'')}</td></tr>`;
    }).join('');
    anchorsBody=`<table class="anchors"><thead><tr><th>Expectation (literature)</th><th>Model observable</th><th>Source</th><th>Status in workspace</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  // (key_assumptions moved up to the §7 "Model & key assumptions" slot)

  // LIMITATIONS & FOLLOW-UPS — the honest debts the study carries and what it
  // opens up next. Both were authored into study.yaml (limitations[],
  // discovery_implications{}) but never surfaced in the report before. Entries
  // may be plain strings or single-key {title: detail} maps (_debtText handles both).
  let debtsBody='';
  if(has(s.limitations)) debtsBody+=`<div class="kicker" style="margin:0 0 4px">Limitations</div><ul class="assumptions">${s.limitations.map(l=>`<li>${_debtText(l)}</li>`).join('')}</ul>`;
  const _di=s.discovery_implications;
  if(_di && typeof _di==='object'){
    const _addDi=(key,label)=>{ const v=_di[key]; if(Array.isArray(v)&&v.length) debtsBody+=`<div class="kicker" style="margin:12px 0 4px">${label}</div><ul class="assumptions">${v.map(x=>`<li>${_debtText(x)}</li>`).join('')}</ul>`; };
    _addDi('resolved_uncertainties','Resolved uncertainties');
    _addDi('new_uncertainties','New uncertainties');
    _addDi('open_questions','Open questions');
    _addDi('followup_study_proposals','Follow-up studies proposed');
  }

  // ---- §7 figure-first narrative slots ---------------------------------------
  // The card reads as a tight scientific argument: question (the serif lead above)
  // → hypothesis + discriminating control → model + key assumptions → decisive
  // figure → quantitative finding → verdict → primary limitation → downstream
  // state-transfer. Each slot no-ops when its field is absent, so an older study
  // (no §7 fields) still renders cleanly; the heavy supporting material (model
  // internals, full figure set, sim run, tests, provenance, follow-ups) collapses
  // into one "Technical record" expander.

  // slot 2 — hypothesis + discriminating control
  const hypoText = s.hypothesis || s.objective || (s.purpose&&s.purpose.mechanism) || '';
  const expText = _experimentOf(s);
  const obsText = _observableOf(s);
  // the discriminating control: a matched-null / ablation baseline arm, else the
  // scaffold analog (proposed_controls) for a planned study.
  const _ctrlArm = (s.baseline||[]).find(b=>b&&/\b(null|matched|ablation|control|no[-\s])/i.test(b.name||''));
  let ctrlHtml='';
  if(_ctrlArm) ctrlHtml=`<div class="disc-control"><span class="dc-k">Discriminating control</span> ${esc(_ctrlArm.name)}</div>`;
  else if(has(s.proposed_controls)) ctrlHtml=`<div class="disc-control"><span class="dc-k">Proposed controls</span><ul class="assumptions" style="margin:4px 0 0">${s.proposed_controls.map(c=>`<li>${_debtText(c)}</li>`).join('')}</ul></div>`;
  let hypoBody='';
  if(hypoText) hypoBody+=`<div class="sp-v">${mdLite(hypoText)}</div>`;
  if(expText) hypoBody+=`<div class="texp" style="margin-top:6px"><span class="dc-k">Model experiment</span> ${mdLite(expText)}</div>`;
  if(obsText) hypoBody+=`<div class="texp" style="margin-top:4px"><span class="dc-k">Observable</span> <span class="mono">${esc(obsText)}</span></div>`;
  hypoBody+=ctrlHtml;

  // slot 3 — model + key assumptions (full bigraph internals go to the technical record)
  let modelSlot=methodsSimsBlock(s);
  if(has(s.key_assumptions)) modelSlot+=`<div class="kicker" style="margin:12px 0 4px">Key assumptions</div><ul class="assumptions">${s.key_assumptions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`;

  // slot 7 — primary limitation (realized study), else the scaffold's honest caveat
  const limText = s.primary_limitation || s.honest_caveat || '';
  const limSlot = limText?`<div class="card-limitation">${mdLite(limText)}</div>`:'';

  // slot 8 — downstream state-transfer (handoff.emits / .receives)
  let handoffBody='';
  const _ho=s.handoff;
  if(_ho && typeof _ho==='object'){
    const _hoRow=(label, arr, dirKey)=> (Array.isArray(arr)&&arr.length)?arr.map(h=>{
      const who=(dirKey==='to')?(h.to!=null?('study '+esc(h.to)):''):(h.from!=null?('study '+esc(h.from)):'');
      const items=(h.provides||h.requires||[]);
      return `<div class="ho-row"><span class="ho-dir">${label}${who?` <span class="ho-who">${who}</span>`:''}</span>${items.length?`<span class="ho-items">${items.map(x=>`<span class="chip mod">${esc(x)}</span>`).join(' ')}</span>`:''}</div>`;
    }).join(''):'';
    handoffBody = _hoRow('Provides →','emits'in _ho?_ho.emits:null,'to') + _hoRow('Requires ←','receives'in _ho?_ho.receives:null,'from');
  }

  // Technical record — everything that supports but isn't the headline argument.
  const techInner =
      part('Model — composite internals', modelBody, 'study:'+s.slug+'/model', s.title+' · Model')
    + part('Simulation run', runBody, 'study:'+s.slug+'/simulation', s.title+' · Simulation run')
    + (anyFigFlagged?part('Full figure set', techFigHtml, 'study:'+s.slug+'/visualizations', s.title+' · Visualizations'):'')
    + part('Tests', testsBody, 'study:'+s.slug+'/tests', s.title+' · Tests')
    + part('Provenance & anchors', anchorsBody, 'study:'+s.slug+'/provenance', s.title+' · Provenance')
    + part('Limitations & follow-ups', debtsBody, 'study:'+s.slug+'/debts', s.title+' · Limitations');
  const techRecord = techInner.trim()
    ? `<details class="exp tech-record"><summary>Technical record — model internals, full figure set, tests, provenance &amp; follow-ups</summary><div class="body">${techInner}</div></details>`
    : '';

  // card badge uses the SAME status derivation as the graph + ladder (workbench
  // _studyStatusMeta), so a running study reads "Investigating" everywhere.
  const sm=studyStatusMeta(s);
  const wbChip=`<span class="status" style="color:${sm.color};background:color-mix(in srgb,${sm.color} 14%,transparent)"><span class="g" style="background:${sm.color}"></span>${esc(sm.label)}</span>`;
  return `<section class="card collapsed ${fail?'is-fail':''} ${planned?'is-planned':''} ${control?'is-control':''}" id="s-${s.slug}">
    <div class="card-h">
      <span class="ctoggle">▾</span>
      <span class="cnum">${String(idx).padStart(2,'0')}</span>
      <h3 class="ctitle">${esc(s.title)}</h3>
      <div class="cright">${control?'<span class="control-kick">⚑ Adversarial control</span>':''}${wbChip}</div>
    </div>
    ${claimLine}${overview}
    <div class="study-summary">${studySummary(s,inv)}</div>
    <div class="study-detail">
      ${part('Hypothesis & discriminating control', hypoBody, 'study:'+s.slug+'/hypothesis', s.title+' · Hypothesis')}
      ${part('Model & key assumptions', modelSlot, 'study:'+s.slug+'/model-assumptions', s.title+' · Model & assumptions')}
      ${anyFigFlagged?part('Decisive figure', decisiveFigBody, 'study:'+s.slug+'/decisive-figure', s.title+' · Decisive figure')
                    :part('Visualizations', techFigHtml, 'study:'+s.slug+'/visualizations', s.title+' · Visualizations')}
      ${part('Finding', findingsBody, 'study:'+s.slug+'/findings', s.title+' · Finding')}
      ${part('Verdict', decisionBody, 'study:'+s.slug+'/decision', s.title+' · Verdict')}
      ${part('Primary limitation', limSlot, 'study:'+s.slug+'/limitation', s.title+' · Primary limitation')}
      ${part('Downstream state-transfer', handoffBody, 'study:'+s.slug+'/handoff', s.title+' · Handoff')}
      ${techRecord}
      ${feedbackRow('study:'+s.slug, 'this whole study')}
    </div>
  </section>`;
}

/* ---------- executive band ---------- */
// The report adapts to what the studies ACTUALLY are, rather than assuming an
// agent-vs-policy competition. Three modes:
//   sourcing  — studies carry a `sourcing` decision (model-sourcing investigations)
//   agentic   — studies carry an `agent_trajectory` (LLM-agent vs policy tasks)
//   generic   — everything else (a normal study: model · run · tests · decision)
function reportMode(inv){
  const ss=inv.studies||[];
  // 'sourcing' is for a sourcing-AUDIT investigation — one whose figure is the
  // reuse/compose/build-new decision map with an audit gate. Requires the actual
  // audit data (s.sourcing.audit), NOT merely a `sourcing.decision`: that is now
  // standard contract metadata on nearly every study, so keying off `s.sourcing`
  // alone mislabelled ordinary claim/agentic investigations as sourcing and
  // showed them an empty, trap-captioned decision map.
  if(ss.some(s=>s.agent_trajectory||s.policy_trajectory)) return 'agentic';
  if(ss.some(s=>s.sourcing&&s.sourcing.audit)) return 'sourcing';
  return 'generic';
}
// (The executive band was split: the scientific front matter now opens the
//  report — heroQuestion / abstractBlock / simulatedWorld / evidenceFraming /
//  renderArgument — and the verdict + stats + ladder moved BELOW it into
//  renderFindings(). reportMode() below still classifies the investigation.)
// The top-level hypothesis as cited claims: the origin-of-cells thesis broken
// into the statements the campaign tests, each with citation chips linking to
// the References section, plus the competing interpretive frameworks. So the
// investigation's headline reasoning traces to its sources, not just the studies.
function renderArgument(inv){
  const sa=inv.scientific_argument||{}; const kc=inv.key_claims||[];
  if(!sa.main_claim && !kc.length && !(sa.evidence_for||[]).length) return '';
  let claims='';
  if(kc.length){
    claims=kc.map(c=>{
      const counter=/contest|unfavorab|challenge|less favorab|may be far less/i.test(c.claim||'');
      return `<li class="${counter?'counter':''}"><span class="ctext">${esc(c.claim||c.text||'')}</span> ${citeRow(c.cites)}</li>`;
    }).join('');
  } else {
    claims=(sa.evidence_for||[]).map(e=>`<li><span class="ctext">${esc(e)}</span></li>`).join('')
      + (sa.evidence_against||[]).map(e=>`<li class="counter"><span class="ctext">${esc(e)}</span></li>`).join('');
  }
  const frames=(inv.competing_frameworks||[]).map(f=>
    `<span class="cframe">${esc(f.name||'')}${f.relation?`<span class="rel">${esc(f.relation)}</span>`:''}</span>`).join('');
  return `<div class="argument fbsection measure" id="hypothesis">${fbBubble('argument','The thesis & its evidence')}
    <div class="sec-h"><h2>The thesis &amp; its evidence</h2><span class="rule"></span></div>
    ${sa.main_claim?`<p class="main-claim">${mdLite(sa.main_claim)}</p>`:''}
    ${claims?`<ul class="claimlist">${claims}</ul>`:''}
    ${frames?`<div class="cframes">${frames}</div>`:''}
    ${has(sa.caveats)?`<details class="exp" style="margin-top:12px"><summary>Caveats</summary><div class="body"><ul style="margin:0;padding-left:18px">${sa.caveats.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div></details>`:''}
  </div>`;
}
// The discovery engine's "what to do next" — value-ranked opportunities, the
// productivity diagnosis, expert-gated study suggestions, and drift. A graceful
// no-op when inv.discovery is absent (older viva_superpowers / other workspaces).
function renderDiscovery(inv){
  const d=inv.discovery; if(!d) return '';
  const diag=d.diagnosis||{};
  const flags=(diag.flags||[]).map(f=>`<span class="chip">${esc(f)}</span>`).join(' ')||'<span class="chip pass">clear</span>';
  const pr=diag.validator_pass_rate; const prTxt=(pr==null)?'n/a':Math.round(pr*100)+'%';
  const na=d.next_action;
  const opps=(d.opportunities||[]).map(o=>{
    const tgt=String(o.source||'').replace(/^claim:/,'');
    const s=(o.score>=0?'+':'')+Number(o.score).toFixed(2);
    return `<tr><td class="mono">${s}</td><td>${esc(o.action)}</td><td>${esc(tgt)}</td><td class="mono" style="color:var(--ink-2)">impact ${o.impact}${o.enable?` · enable ${o.enable}`:''}</td></tr>`;
  }).join('');
  const awaiting=(d.suggestions||[]).filter(s=>s.status==='awaiting_expert');
  const suggRows=awaiting.map(s=>{
    const needs=String(s.needs||''); const short=needs.length>140?needs.slice(0,140)+'…':needs;
    return `<li><b>${esc(s.parent||s.id||'')}</b> — needs: ${esc(short)}</li>`;
  }).join('');
  const census=Object.entries(d.validator_census||{}).map(([k,v])=>`${v} ${k}`).join(' · ');
  const plan=(d.execution_plan||[]).map(p=>{
    const tgt=String(p.source||'').replace(/^claim:/,'');
    const sc=(p.score>=0?'+':'')+Number(p.score).toFixed(2);
    const cls=String(p.consequence||'');
    const badge=cls==='safe'?'chip pass':(cls==='human-only'?'chip':'chip decision');
    const cmd=p.command?`<div class="mono" style="color:var(--ink-2);font-size:12px;margin-top:2px">${esc(String(p.command).slice(0,120))}</div>`:'';
    return `<tr><td class="mono">${sc}</td><td>${esc(p.action)}</td><td>${esc(tgt.length>48?tgt.slice(0,48)+'…':tgt)}</td><td><span class="${badge}">${esc(cls)}</span>${cmd}</td></tr>`;
  }).join('');
  return `<div class="fbsection measure" id="discovery">
    <div class="sec-h"><h2>Discovery — what to do next</h2><span class="rule"></span></div>
    <p style="color:var(--ink-2);font-size:14px">${d.closed?`Closed — acceptance criteria met${d.frontier_size?` · ${d.frontier_size} residual (hardening, non-blocking)`:''}`:`Open · ${d.closure_blocking!=null?`${d.closure_blocking} blocking closure · `:''}frontier ${d.frontier_size}`} · validator pass-rate ${prTxt} · diagnosis: ${flags}${na?` · next: <b>${esc(na.op)}</b> on ${esc(String(na.target).slice(0,60))}`:''}</p>
    <h3 style="margin:14px 0 6px">Most valuable to investigate <span class="mono" style="color:var(--ink-2);font-weight:400">(value-ranked)</span></h3>
    <table class="ttable"><tbody><tr><th>score</th><th>action</th><th>target</th><th>why</th></tr>${opps}</tbody></table>
    ${awaiting.length?`<h3 style="margin:14px 0 6px">Suggested new studies <span class="mono" style="color:var(--ink-2);font-weight:400">(awaiting expert input)</span></h3><ul style="margin:0;padding-left:18px">${suggRows}</ul>`:''}
    ${plan?`<h3 style="margin:14px 0 6px">Decide — the next action &amp; how it runs <span class="mono" style="color:var(--ink-2);font-weight:400">(gated)</span></h3><table class="ttable"><tbody><tr><th>score</th><th>action</th><th>target</th><th>how &amp; consequence</th></tr>${plan}</tbody></table>`:''}
    <p style="color:var(--ink-2);font-size:13px;margin-top:10px">drift: ${d.drift.divergences} verdict divergences, ${d.drift.stale_validations} stale validations${census?` · validators: ${census}`:''}</p>
  </div>`;
}
// dedicated place for the FINAL investigation-level visualizations
function renderInvViz(inv){
  const figs=[];
  const MODE=reportMode(inv);
  if(MODE==='sourcing'){ figs.push(['Sourcing decision map', vizDecisionMap(inv)]); }
  else if(MODE==='agentic'){ figs.push(['Agent vs policy — outcomes', vizOutcomeBar(inv)]); figs.push(['Final test outcomes', vizGateMatrix(inv)]); }
  else { figs.push(['Where the transitions are viable — passing vs failing regions', vizGateMatrix(inv)]); }
  const live=figs.filter(f=>f[1]); if(!live.length) return '';
  return `<div id="inv-viz" class="fbsection">${fbBubble('figures','Investigation visualizations')}<div class="sec-h"><h2>Investigation visualizations</h2><span class="rule"></span></div>
    <p class="measure" style="color:var(--ink-2);font-size:14px;margin:0 0 6px">The investigation across all ${inv.studies.length} studies — passing and failing regions in one visual language.</p>
    ${live.map(([t,svg])=>`<div style="margin:20px 0"><div class="kicker" style="margin-bottom:8px">${esc(t)}</div>${svg}</div>`).join('')}</div>`;
}
function roleLine(s,inv){
  if(s.sourcing){ const mods=(s.sourcing.modules||[]).join(' + ')||'new module';
    return `${esc(s.sourcing.decision)} · <span class="mono">${esc(mods)}</span>`; }
  const a=s.agent_trajectory&&s.agent_trajectory.result, p=s.policy_trajectory&&s.policy_trajectory.result;
  if(a||p){
    const av=a?(a.state==='DONE'?`agent ✓ ${a.edits}e`:'agent ✗'):'';
    const pv=p?(p.state==='DONE'?` · policy ✓`:` · policy ✗ give-up`):'';
    return av+pv;
  }
  // generic: the most informative available summary — test count + what it found
  const nt=(s.behavior_tests||[]).length;
  const c=s.verdict_counts||{}; const np=c.passed||0;
  let summary=s.claim||(s.findings&&s.findings[0]&&(s.findings[0].summary||s.findings[0].claim))||'';
  summary=String(summary).split('\n')[0].trim();
  const bits=[];
  if(nt) bits.push(`${np?np+'/':''}${nt} test${nt===1?'':'s'}${np?' pass':''}`);
  if(summary) bits.push(`<span style="color:var(--ink-2)">${esc(summary.length>90?summary.slice(0,88)+'…':summary)}</span>`);
  return bits.join(' · ')||'—';
}

/* ---------- computational architecture (appendix, demoted to the END) ----------
   The implementation inventory — reusable modules + declared capabilities — is
   the Process-Bigraph plumbing, not the scientific narrative. It lives in a
   clearly-labelled appendix at the end of the report, out of the main flow. */
function renderAppendix(inv){
  if(!inv.catalog) return '';
  const rows=Object.entries(inv.catalog).map(([m,caps])=>
    `<tr><td class="m">${esc(m)}</td><td>${caps.map(c=>`<span class="chip mod" style="margin:2px">${esc(c)}</span>`).join('')}</td></tr>`).join('');
  return `<div class="appendix fbsection" id="appendix">
    ${fbBubble('appendix','Computational architecture (appendix)')}
    <div class="sec-h"><h2>Appendix — computational architecture</h2><span class="rule"></span></div>
    <p class="measure" style="color:var(--ink-2);font-size:14px">The reusable Process-Bigraph modules the studies are built from, and the capabilities each declares.</p>
    <table class="cat-table"><thead><tr><th>Module</th><th>Declared capabilities</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

/* ---------- references (provenance targets for the citation chips) ---------- */
function _collectCites(inv){
  // Count every bibkey used across the investigation so the References section
  // lists exactly the sources the studies rest on, most-cited first.
  const cnt={};
  const bump=ks=>(ks||[]).forEach(k=>{ if(k) cnt[k]=(cnt[k]||0)+1; });
  (inv.studies||[]).forEach(s=>{
    (s.literature_anchors||[]).forEach(a=>bump(a.cites));
    (s.behavior_tests||[]).forEach(t=>bump(t.cites));
    (s.findings||[]).forEach(f=>bump((f.expected&&f.expected.cites)||f.cites));
  });
  bump(inv.inv_references);
  return cnt;
}
function renderReferences(inv){
  const cnt=_collectCites(inv);
  const keys=Object.keys(cnt);
  if(!keys.length) return '';
  keys.sort((a,b)=>(cnt[b]-cnt[a])||((REFS[a]&&REFS[a].label||a).localeCompare(REFS[b]&&REFS[b].label||b)));
  const rows=keys.map(k=>{
    const r=REFS[k]||{};
    const label=r.label||k;
    // One compact line per reference: count · label · key — title · author, year · source.
    const bits=[r.title,[r.author,r.year].filter(Boolean).join(', ')].filter(Boolean).join(' · ');
    const link=r.url?` · <a href="${esc(r.url.startsWith('http')?r.url:'https://doi.org/'+r.url)}" target="_blank" rel="noopener">source ↗</a>`:'';
    const n=cnt[k];
    return `<div class="refentry" id="ref-${esc(k)}"><span class="rcount">${n}×</span>`+
      `<b class="rt">${esc(label)}</b> <span class="rk">${esc(k)}</span>`+
      `${bits?` <span class="rmeta">— ${esc(bits)}</span>`:''}${link}</div>`;
  }).join('');
  return `<div class="appendix fbsection" id="references">
    ${fbBubble('references','References')}
    <div class="sec-h"><h2>References</h2><span class="rule"></span></div>
    <p style="color:var(--ink-2);font-size:14px;max-width:none">The papers behind each acceptance band, finding and literature anchor.</p>
    <div class="refs-list">${rows}</div>
  </div>`;
}

/* ---------- feedback ---------- */
let FB={}, CUR='model-sourcing';
function fbKeyStore(){ return 'viva-fb-'+CUR; }
function loadFB(){ try{ FB=JSON.parse(localStorage.getItem(fbKeyStore())||'{}'); }catch(e){ FB={}; } }
function saveFB(){ try{ localStorage.setItem(fbKeyStore(), JSON.stringify(FB)); }catch(e){} updateCount(); }
function setFB(key,patch){ FB[key]={...(FB[key]||{}),...patch};
  if(!FB[key].note && !FB[key].disp) delete FB[key]; saveFB(); }
function fbCount(){ return Object.keys(FB).length; }
function updateCount(){ const el=document.getElementById('fbcnt'); if(el) el.textContent=fbCount(); }
// Legacy inline editor row — superseded by the shared feedback engine's popover.
// No-op so render markup that calls feedbackRow('overall', …) stays intact.
function feedbackRow(key,label){ return ''; }
function yq(s){ return '"'+String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,' ')+'"'; }
function genYaml(inv){
  const L=['feedback_report:','  investigation: '+inv.slug,'  title: '+yq(inv.title),
    '  reviewer: ""','  date: ""'];
  const emit=(k,ind)=>{ const f=FB[k]||{}; if(f.disp) L.push(ind+'disposition: '+f.disp); if(f.note) L.push(ind+'note: '+yq(f.note)); };
  if(FB['overall']){ L.push('  overall:'); emit('overall','    '); }
  const invSecs=Object.keys(FB).filter(k=>k!=='overall'&&!k.startsWith('study:'));
  if(invSecs.length){ L.push('  sections:'); invSecs.forEach(k=>{ L.push('    - section: '+k); emit(k,'      '); }); }
  const rows=inv.studies.filter(s=>Object.keys(FB).some(k=>k==='study:'+s.slug||k.startsWith('study:'+s.slug+'/')));
  if(rows.length){ L.push('  studies:');
    rows.forEach(s=>{ L.push('    - study: '+s.slug); L.push('      verdict: '+gateOf(s));
      if(FB['study:'+s.slug]) emit('study:'+s.slug,'      ');
      const secs=Object.keys(FB).filter(k=>k.startsWith('study:'+s.slug+'/'));
      if(secs.length){ L.push('      sections:'); secs.forEach(k=>{ L.push('        - section: '+k.split('/')[1]); emit(k,'          '); }); }
    });
  }
  if(!Object.keys(FB).length) L.push('  # (no notes yet — hover any section and click the 💬 to add feedback)');
  return L.join('\n')+'\n';
}
function markBubble(key){ document.querySelectorAll('.fbbubble').forEach(b=>{ if(b.dataset.fb===key) b.classList.toggle('has', !!FB[key]); }); }

/* ---------- TOC + scroll spy ---------- */
function toc(inv){
  const exv=inv.executive||{}, syn=inv.synthesis||{};
  // Lean, evidence-led main TOC. Context/front-matter (how-to-read, design
  // background, ground rules, the key-figure gallery) now lives in the
  // Supplement, reached via the single Supplement link.
  const front=['<a href="#exec-summary" class="exec">Summary</a>'];
  if(inv.discovery) front.push('<a href="#discovery">Discovery</a>');
  if(inv.spine) front.push('<a href="#spine-presentation">Map</a>');
  if((inv.studies||[]).length) front.push('<a href="#studies">Studies</a>');
